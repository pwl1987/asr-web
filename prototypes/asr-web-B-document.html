<!doctype html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>会议转写工作台 · 方向 B 文稿优先</title>
<style>
/* ══ 方向 B：纸白单栏。听与读是主角；操作退成句子里的动词；盒子几乎不存在 ══ */
:root{
  --paper:#f6f4f0;          /* 页面：纸 */
  --sheet:#fcfbf9;          /* 阅读面：稿纸 */
  --wash:#efece6;           /* 输入/悬浮：湿一遍的纸 */
  --ink:#1b1e22; --ink-2:#41474e; --muted:#626a74;
  --hair:rgba(27,30,34,.13); --hair-2:rgba(27,30,34,.24);
  --accent:#b0442c;         /* 朱砂：印章/校批 */
  --accent-wash:rgba(176,68,44,.09);
  --ok:#2f7d55; --warn:#8a6216; --err:#a63a34;
  --s1:#35649f; --s2:#256b60; --s3:#7f5715; --s4:#7f4379; --s5:#456e2f; --s6:#4f5973;
  --ui:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --cap:12px; --small:14px; --body:17px; --h3:21px; --h2:26px; --display:34px;
  --s1p:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r:8px; --r-lg:12px;
  --fast:100ms; --dur:150ms; --slow:240ms; --ease:cubic-bezier(.2,0,0,1);
  --col:74ch; --gut:96px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-size:var(--small);line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
::selection{background:var(--accent-wash)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
p{margin:0}
svg{display:block}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.ser{font-family:var(--serif)}

/* ── 控件：纸上的动词，不是塑料按钮 ─────────────────── */
.act{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border-radius:var(--r);
  font-size:var(--small);letter-spacing:.02em;color:var(--ink-2);border:1px solid var(--hair);background:var(--sheet);
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),border-color var(--fast) var(--ease),
             transform var(--fast) var(--ease)}
.act:hover:not(:disabled){background:var(--wash);color:var(--ink);border-color:var(--hair-2)}
.act:active:not(:disabled){transform:translateY(1px)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act.go{background:var(--accent);border-color:transparent;color:#fdf7f4;font-weight:600}
.act.go:hover:not(:disabled){filter:brightness(1.06);color:#fdf7f4}
.act.txt{border-color:transparent;background:none;color:var(--muted)}
.act.txt:hover:not(:disabled){color:var(--ink);background:var(--wash)}
.act[aria-pressed="true"]{color:var(--ink);background:var(--wash);border-color:var(--hair-2)}
.act.sm{min-height:26px;padding:0 9px;font-size:var(--cap)}
.fld{display:inline-flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--hair);
  border-radius:var(--r);padding:0 10px;min-height:32px}
.fld:focus-within{border-color:var(--hair-2);background:#fff}
.fld input{background:none;border:none;outline:none;min-width:0;flex:1;font-size:var(--small);padding:5px 0}
.fld input::placeholder{color:var(--muted)}
.fld svg{color:var(--muted);flex:none}
select{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);padding:5px 8px;
  font-size:var(--cap);color:var(--ink-2)}
kbd{font-family:var(--num);font-size:var(--cap);background:var(--wash);border:1px solid var(--hair-2);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.tabs{display:inline-flex;gap:2px;background:var(--wash);border-radius:var(--r);padding:3px}
.tabs button{padding:5px 13px;border-radius:6px;font-size:var(--small);color:var(--muted);letter-spacing:.02em;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(27,30,34,.1)}
.rot{width:12px;height:12px;border:1.8px solid var(--hair-2);border-top-color:var(--accent);border-radius:50%;
  animation:sp .8s linear infinite;flex:none;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

/* ── 骨架 ──────────────────────────────────────────── */
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
.bar{display:flex;align-items:center;gap:var(--s4);min-height:52px;padding:0 var(--s6);
  background:var(--paper);border-bottom:1px solid var(--hair)}
.bar .mark{font-family:var(--serif);font-size:var(--h3);letter-spacing:-.01em}
.bar .mark em{font-style:normal;font-family:var(--num);font-size:var(--cap);color:var(--muted);
  letter-spacing:.1em;margin-left:8px}
.bar .sp{flex:1}
.doc{min-height:0;overflow:auto;overscroll-behavior:contain;padding:var(--s7) var(--s6) var(--s8)}
.wrap{max-width:calc(var(--col) + var(--gut));margin:0 auto}
/* 状态句：流程不占一栏，就是一行句子 */
.flow{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;font-size:var(--cap);color:var(--muted);
  letter-spacing:.02em;margin-bottom:var(--s4)}
.flow .f{display:inline-flex;align-items:center;gap:6px}
.flow .f b{color:var(--ink);font-weight:600;font-size:var(--small)}
.flow .sep{color:var(--hair-2)}
.flow .ok{color:var(--ok)}
.flow .no{color:var(--warn)}
h1.ti{font-family:var(--serif);font-size:var(--display);letter-spacing:-.02em;line-height:1.18;font-weight:600}
h1.ti input{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:1px solid transparent;
  border-radius:5px;padding:0 4px;margin-left:-4px;width:100%}
h1.ti input:hover{border-color:var(--hair)}
h1.ti input:focus{border-color:var(--hair-2);background:var(--sheet)}
.meta{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3);
  font-size:var(--cap);color:var(--muted)}
.meta .num{color:var(--ink-2)}
.sw{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin:var(--s6) 0 var(--s5);
  padding-bottom:var(--s4);border-bottom:1px solid var(--hair)}
.sw .sp{flex:1}

/* ── 转写：稿纸 + 天头地脚的时码旁注 ───────────────── */
.sheetBox{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:var(--s6) var(--s7) var(--s7)}
.turn{position:relative;padding-left:var(--gut);margin-bottom:var(--s6)}
.turn:last-child{margin-bottom:0}
.turn .tg{position:absolute;left:0;top:2px;width:calc(var(--gut) - var(--s4));text-align:right;
  font-family:var(--num);font-size:var(--cap);color:var(--muted);cursor:pointer;letter-spacing:.02em}
.turn .tg:hover{color:var(--accent)}
.turn .who{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.turn .who i{width:7px;height:7px;border-radius:50%;background:var(--sp);flex:none}
.turn .who .nm{font-size:var(--cap);letter-spacing:.1em;color:var(--sp);font-weight:600;
  border:1px solid transparent;border-radius:4px;padding:1px 4px;margin-left:-4px}
.turn .who .nm:hover{border-color:var(--hair);background:var(--wash)}
.turn .bd{font-family:var(--serif);font-size:var(--body);line-height:1.9;color:var(--ink);
  word-break:break-word;cursor:text}
.dense .turn{margin-bottom:var(--s4)}
.dense .turn .bd{font-size:var(--small);line-height:1.75}
.turn .bd mark{background:rgba(176,68,44,.16);border-radius:2px;padding:0 1px}
.turn .or{display:block;font-family:var(--ui);font-size:var(--cap);color:var(--muted);margin-top:4px}
.turn .or s{text-decoration:line-through;text-decoration-color:rgba(166,58,52,.55)}
.turn .fx{position:absolute;left:0;top:22px;width:calc(var(--gut) - var(--s4));text-align:right;
  font-size:var(--cap);color:var(--muted)}
.turn .fx.h{color:var(--warn)}
.turn .fx.l{color:var(--s2)}
.turn .fx.u{color:var(--warn)}
.turn .ops{display:flex;gap:2px;margin-top:6px;opacity:0;transition:opacity var(--fast) var(--ease)}
.turn:hover .ops,.turn:focus-within .ops{opacity:1}
.turn.now{background:var(--accent-wash);border-radius:var(--r);padding-top:var(--s2);padding-bottom:var(--s2);
  margin-left:calc(var(--s2) * -1);padding-left:calc(var(--gut) + var(--s2))}
.ed{margin-top:var(--s3);background:var(--paper);border:1px solid var(--hair-2);border-radius:var(--r);padding:var(--s3)}
.ed textarea{width:100%;min-height:84px;background:#fff;border:1px solid var(--hair);border-radius:6px;
  padding:9px 11px;font-family:var(--serif);font-size:var(--small);line-height:1.8;resize:vertical;outline:none;color:var(--ink)}
.ed textarea:focus{border-color:var(--hair-2)}
.ed .r{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap}

/* ── 材料：一份能直接递给领导的文件 ────────────────── */
.paper{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:var(--s8) var(--s8) var(--s8) calc(var(--gut) + var(--s6));position:relative}
.paper .stamp{position:absolute;right:var(--s6);top:var(--s6);font-family:var(--num);font-size:var(--cap);
  color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 7px;letter-spacing:.06em}
.paper h2{font-family:var(--serif);font-size:var(--h2);letter-spacing:-.015em;font-weight:600}
.paper .sub{font-size:var(--cap);color:var(--muted);letter-spacing:.04em;margin-top:6px;
  padding-bottom:var(--s5);border-bottom:1px solid var(--hair)}
.paper h3{font-family:var(--ui);font-size:var(--cap);letter-spacing:.12em;color:var(--accent);
  font-weight:600;margin:var(--s6) 0 var(--s3)}
.paper p,.paper li{font-family:var(--serif);font-size:var(--body);line-height:1.95;color:var(--ink)}
.paper ul,.paper ol{margin:0 0 var(--s4);padding-left:1.4em}
.paper li{margin-bottom:7px}
table.tb{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:var(--small)}
table.tb th{text-align:left;font-size:var(--cap);letter-spacing:.06em;color:var(--muted);font-weight:600;
  padding:0 10px 7px 0;border-bottom:1px solid var(--hair-2)}
table.tb td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hair);color:var(--ink-2);vertical-align:top}
table.tb td.own{color:var(--ink);white-space:nowrap}
table.tb tr:last-child td{border-bottom:none}
.rf{font-family:var(--num);font-size:var(--cap);color:var(--accent);cursor:pointer;vertical-align:.24em;
  padding:0 1px;border:none;background:none;line-height:1}
.rf:hover{text-decoration:underline}
/* 理解：条目即批注 */
.uSec{margin-bottom:var(--s6)}
.uSec h3{font-size:var(--cap);letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:var(--s3)}
.uRow{display:grid;grid-template-columns:1fr auto;gap:4px var(--s4);padding:var(--s3) 0;
  border-bottom:1px solid var(--hair)}
.uRow:last-child{border-bottom:none}
.uRow .t{font-family:var(--serif);font-size:var(--small);line-height:1.7;color:var(--ink)}
.uRow .mo{font-size:var(--cap);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  grid-column:1 / -1}
.uRow .mo em{font-style:normal;color:var(--ink)}
.db{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--s4)}
.db .sp{flex:1}
.his{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--hair);
  cursor:pointer;font-size:var(--small)}
.his:last-child{border-bottom:none}
.his:hover .t{color:var(--accent)}
.his .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.his .w{font-size:var(--cap);color:var(--muted)}
.k{font-size:var(--cap);letter-spacing:.12em;color:var(--muted);font-weight:600}

/* ── 五态 ─────────────────────────────────────────── */
.load{background:var(--wash);border-radius:4px;background-image:linear-gradient(90deg,rgba(27,30,34,.04),
  rgba(27,30,34,.09),rgba(27,30,34,.04));background-size:200% 100%;animation:sh 1.4s var(--ease) infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{border:1px dashed var(--hair-2);border-radius:var(--r-lg);padding:var(--s7) var(--s6);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);background:var(--sheet)}
.empty h3{font-family:var(--serif);font-size:var(--h3);letter-spacing:-.01em}
.empty p{font-size:var(--small);color:var(--muted);max-width:46ch}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--small);color:var(--ink-2);
  background:var(--accent-wash);border:1px solid rgba(176,68,44,.24);border-left:2px solid var(--accent);
  border-radius:var(--r);padding:10px var(--s4);margin-bottom:var(--s5)}
.banner.i{background:var(--wash);border-color:var(--hair);border-left-color:var(--ink-2)}
.err{display:flex;gap:10px;align-items:flex-start;background:rgba(166,58,52,.07);border:1px solid rgba(166,58,52,.3);
  border-radius:var(--r-lg);padding:var(--s4)}
.err .t{font-size:var(--small);font-weight:600;color:var(--err)}
.err .d{font-size:var(--cap);color:var(--ink-2);margin-top:3px;line-height:1.6}

/* ── 底部播放条 ───────────────────────────────────── */
.plyr{display:flex;align-items:center;gap:var(--s5);padding:var(--s3) var(--s6);
  background:var(--sheet);border-top:1px solid var(--hair);padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom))}
.plyr .btn{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;
  place-items:center;flex:none;transition:transform var(--fast) var(--ease),filter var(--fast) var(--ease)}
.plyr .btn:hover{filter:brightness(1.25)}.plyr .btn:active{transform:scale(.94)}
.plyr .tc{font-family:var(--num);font-size:var(--small);color:var(--ink-2);white-space:nowrap}
.plyr .tc em{font-style:normal;color:var(--muted)}
.wav{flex:1;min-width:60px;height:30px;position:relative;cursor:pointer;border-radius:3px}
.wav svg{width:100%;height:100%}
.wav .b{fill:rgba(27,30,34,.26)}.wav .q{fill:rgba(27,30,34,.08)}
.wav .pl{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--accent);left:0}
.wav:hover .b{fill:rgba(27,30,34,.4)}
.plyr .tl{display:flex;align-items:center;gap:var(--s2);flex:none}

/* ── 抽屉 / 弹层 / toast ──────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(40,34,28,.32);z-index:40;opacity:0;pointer-events:none;
  transition:opacity var(--slow) var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--hair-2);display:none;
  box-shadow:0 18px 48px rgba(40,34,28,.24)}
.sheet.open{display:block}
.sheet.dr{top:0;bottom:0;right:0;width:min(430px,94vw);border-right:none;animation:dr var(--slow) var(--ease)}
.sheet.dl{top:0;bottom:0;left:0;width:min(340px,90vw);border-left:none;animation:dl var(--slow) var(--ease)}
@keyframes dr{from{transform:translateX(22px);opacity:.4}}
@keyframes dl{from{transform:translateX(-22px);opacity:.4}}
.sheet.md{top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,92vw);border-radius:var(--r-lg);
  max-height:84vh;overflow:auto}
.sheet .sh{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);
  border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--paper);z-index:1}
.sheet .sh h2{font-family:var(--serif);font-size:var(--h3);letter-spacing:-.01em;flex:1}
.sheet .sb{padding:var(--s5)}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:var(--small)}
.li:last-of-type{border-bottom:none}
.li .sp{flex:1}
.li .w s{text-decoration:line-through;text-decoration-color:rgba(166,58,52,.5);color:var(--muted)}
.pv{background:var(--wash);border:1px solid var(--hair);border-radius:var(--r);padding:var(--s2) var(--s3);
  margin-top:var(--s3);font-size:var(--cap);color:var(--ink-2);max-height:184px;overflow:auto}
.pv li{list-style:none;margin:5px 0;line-height:1.6}
.pv .to{color:var(--ok)}.pv .dl{color:var(--muted);text-decoration:line-through}
.mItem{display:block;width:100%;text-align:left;padding:var(--s3) var(--s4);border-radius:var(--r);
  border-left:2px solid transparent;transition:background var(--fast) var(--ease)}
.mItem:hover{background:var(--wash)}
.mItem[aria-current="true"]{background:var(--wash);border-left-color:var(--accent)}
.mItem .n{display:block;font-size:var(--small);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mItem .m{display:block;font-size:var(--cap);color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mItem .pf{display:flex;gap:2px;margin-top:7px}
.mItem .pf i{height:2px;flex:1;background:var(--hair-2);border-radius:1px}
.mItem .pf i.d{background:var(--ok)}.mItem .pf i.p{background:var(--warn)}.mItem .pf i.n{background:var(--accent)}
.job{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--hair)}
.job .r{display:flex;align-items:center;gap:var(--s3);font-size:var(--cap);color:var(--muted)}
.job .r b{color:var(--ink);font-size:var(--small);font-weight:600}
.job .pb{height:2px;background:var(--hair-2);margin:var(--s3) 0;overflow:hidden;border-radius:1px}
.job .pb i{display:block;height:100%;background:var(--accent);transition:width var(--dur) var(--ease)}
.kb{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:var(--small);align-items:center}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);z-index:60;display:flex;align-items:center;
  gap:10px;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 16px;font-size:var(--small);
  opacity:0;pointer-events:none;box-shadow:0 12px 32px rgba(40,34,28,.28);max-width:min(540px,92vw);
  transition:opacity var(--slow) var(--ease),transform var(--slow) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .act{color:var(--paper);border-color:rgba(252,251,249,.3)}
.toast .act.txt{border-color:transparent}

/* ── 响应式 ───────────────────────────────────────── */
@media (max-width:1023px){
  .bar{padding:0 var(--s5)}
  .doc{padding:var(--s6) var(--s5) var(--s7)}
  .sheetBox,.paper{padding:var(--s6)}
  .paper{padding-left:var(--s6)}
  :root{--gut:64px}
}
@media (max-width:759px){
  :root{--body:16px;--display:26px;--gut:0px}
  .bar{min-height:48px;padding:0 var(--s4);gap:var(--s3);flex-wrap:nowrap}
  .bar .mark,.bar #gpuChip{display:none}
  .act.go{padding:0 12px;font-size:var(--cap)}
  .doc{padding:var(--s5) var(--s4) var(--s6)}
  .sheetBox{padding:var(--s5) var(--s4);border-radius:var(--r)}
  .turn{padding-left:0}
  .turn .tg{position:static;width:auto;text-align:left;display:inline-block;margin-bottom:4px}
  .turn .fx{position:static;text-align:left;display:inline-block;margin-left:10px;width:auto}
  .turn .bd{font-size:var(--small);line-height:1.8}
  .paper{padding:var(--s5) var(--s4)}

      S.mid=MEETS[0].id;S.t=0;S.state='load';S.docId=null;setTabs();headRender();bodyRender();navRender();
      toast('上传完成，正在转写（2 分 48 秒录音，本机 GPU）',{u:0})}},90)};
function setTabs(){var mp={t:'vT',u:'vU',d:'vD'};
  ['vT','vU','vD'].forEach(function(i){$(i).setAttribute('aria-selected',mp[S.view]===i)});
  filtersRender()}
$('vT').onclick=function(){S.view='t';setTabs();bodyRender()};
$('vU').onclick=function(){S.view='u';setTabs();bodyRender()};
$('vD').onclick=function(){S.view='d';setTabs();bodyRender()};
$('body').addEventListener('click',function(e){var t=e.target;
  var tk=t.closest('[data-tk]');if(tk){seek(+tk.dataset.tk);play(1);return}
  var pd=t.closest('[data-p]');if(pd){seek(+pd.dataset.p);play(1);return}
  var rf=t.closest('[data-rf]');if(rf){seek(+rf.dataset.rf);play(1);return}
  var ed=t.closest('[data-ed]');if(ed){S.edit=+ed.dataset.ed;bodyRender();
    var ta=$('ta');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}return}
  var sv=t.closest('[data-sv]');if(sv){var v=sg(+sv.dataset.sv),val=$('ta').value.trim();
    if(!val){toast('内容不能为空，否则这段就没有文本了',{e:1,u:0});return}
    v.x=val;v.b='human';if(!v.o)v.o=val;S.edit=null;S.staleSeg++;
    headRender();bodyRender();navRender();toast('已保存：原文仍在「看原始稿」里');return}
  var cx=t.closest('[data-cx]');if(cx){S.edit=null;bodyRender();return}
  var cp=t.closest('[data-cp]');if(cp){toast('已复制该段（原型模拟）',{u:0});return}
  var rn=t.closest('[data-rn]');if(rn){var id=+rn.dataset.rn,ip=document.createElement('input');
    ip.className='nm';ip.value=spk(id).n;ip.style.width='120px';ip.setAttribute('aria-label','说话人名字');
    rn.replaceWith(ip);ip.focus();ip.select();
    var done=function(){spk(id).n=ip.value.trim()||spk(id).n;bodyRender();
      toast('说话人改名，'+SG().filter(function(v){return v.s===id}).length+' 段同时更新',{u:0})};
    ip.onblur=done;ip.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();done()}if(ev.key==='Escape')bodyRender()};return}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeOver();if(S.edit!==null){S.edit=null;bodyRender()}return}
  var tg=(e.target.tagName||'').toLowerCase(),ty=tg==='input'||tg==='textarea'||tg==='select';
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();
    if(S.edit!==null){var b=document.querySelector('[data-sv="'+S.edit+'"]');if(b)b.click()}else startJob();return}
  if(ty)return;
  if(e.key===' '){e.preventDefault();play();return}
  if(e.key==='/'){e.preventDefault();S.view='t';setTabs();bodyRender();$('sq').focus();return}
  if(e.key==='?'){e.preventDefault();openSheet('helpSheet');return}
  if(e.key==='j'||e.key==='k'){var a=vis(),c=curS();if(!a.length)return;
    var i=c?a.findIndex(function(x){return x.id===c.id}):-1;
    i=Math.max(0,Math.min(a.length-1,i+(e.key==='j'?1:-1)));
    seek(a[i].t);play(1);var el=$('tn-'+a[i].id);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
    e.preventDefault();return}
  if(e.key==='e'){var c2=curS();if(c2&&S.view==='t'){S.edit=c2.id;bodyRender();var ta=$('ta');if(ta)ta.focus()}e.preventDefault()}});

/* ── 术语表 / 全文替换 ── */
$('termBtn')&&($('termBtn').onclick=function(){openSheet('termSheet');termRender()});
function termRender(){
  $('tsBody').innerHTML='<div class="job" style="margin:0 0 var(--s5);padding:0;border:none;font-size:var(--cap);color:var(--muted);line-height:1.6">'+
    '术语表对新任务做热词、对校对结果做确定性纠正；全文替换只改人工修正层，原始转写永远不动。</div>'+
    '<h3 class="k" style="margin:0 0 var(--s3)">本场全文替换</h3>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="fld" style="flex:1;min-width:130px"><input id="rF" type="text" placeholder="原文 / 错写" aria-label="替换来源"></label>'+
    '<label class="fld" style="flex:1;min-width:130px"><input id="rT" type="text" placeholder="替换为" aria-label="替换目标"></label></div>'+
    '<div class="pv" id="rP" hidden></div>'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:var(--s3)">'+
    '<button class="act" id="rPv">预览命中</button><button class="act go" id="rAp" disabled>替换全部</button>'+
    '<label class="act txt sm" style="cursor:pointer"><input type="checkbox" id="rST" checked style="accent-color:var(--accent)"> 同时存为术语</label>'+
    '<button class="act txt" id="rUn" hidden>撤销这次替换</button></div>'+
    '<h3 class="k" style="margin:var(--s6) 0 var(--s3)">全局术语表</h3><div id="tL">'+
    (TERMS.length?TERMS.map(function(t,i){return '<div class="li"><span class="w"><s>'+esc(t[1])+'</s></span>'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14M14 7l5 5-5 5"/></svg>'+
      '<span>'+esc(t[0])+'</span><span class="sp"></span>'+
      '<button class="act txt sm" data-tm="'+i+'" aria-label="删除术语">删除</button></div>'}).join('')
      :'<p style="font-size:var(--small);color:var(--muted)">还没有术语。把反复写错的人名、专名存进来，以后不用每场都改。</p>')+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:var(--s3);flex-wrap:wrap">'+
    '<label class="fld" style="flex:1;min-width:120px"><input id="tW" type="text" placeholder="错写 / 旧写法" aria-label="术语错写"></label>'+
    '<label class="fld" style="flex:1;min-width:120px"><input id="tR" type="text" placeholder="正确写法" aria-label="术语正确写法"></label>'+
    '<button class="act" id="tAd">添加</button></div>';
  $('rPv').onclick=function(){var f=$('rF').value.trim(),t=$('rT').value.trim(),p=$('rP');
    if(!f||!t){p.hidden=false;p.innerHTML='<li>请同时填「原文」和「替换为」。</li>';$('rAp').disabled=true;return}
    var hs=SG().filter(function(v){return v.x.indexOf(f)>=0});
    p.hidden=false;p.innerHTML='<li>命中 <b>'+hs.length+'</b> 段（原始转写不动）：</li>'+hs.slice(0,6).map(function(v){
      return '<li><span class="num" style="color:var(--muted)">#'+v.id+'</span> '+
        esc(v.x.replace(f,'§')).replace('§','<span class="to">'+esc(t)+'</span>')+'</li>'}).join('');
    $('rAp').disabled=!hs.length};
  $('rAp').onclick=function(){var f=$('rF').value.trim(),t=$('rT').value.trim(),k=0;
    SG().forEach(function(v){if(v.x.indexOf(f)>=0){v.x=v.x.split(f).join(t);v.b='human';k++}});
    if($('rST').checked)TERMS.unshift([t,f]);S.staleSeg+=k;$('rUn').hidden=false;
    termRender();headRender();bodyRender();navRender();toast('已替换 '+k+' 段')};
  $('rUn').onclick=function(){toast('已撤销：3 段恢复原值与来源',{u:0});$('rUn').hidden=true};
  $('tAd').onclick=function(){var w=$('tW').value.trim(),r=$('tR').value.trim();
    if(!w||!r){toast('两端都要填：错写 → 正确写法',{e:1,u:0});return}
    TERMS.unshift([r,w]);termRender();navRender();toast('已加入术语表')};
  document.querySelectorAll('[data-tm]').forEach(function(b){b.onclick=function(){var i=+this.dataset.tm,x=TERMS.splice(i,1)[0];
    termRender();navRender();toast('已删除「'+x[1]+' → '+x[0]+'」',{u:0})}});
}

/* ── 演示条与设计说明 ── */
(function(){
  var d=document.createElement('div');d.setAttribute('data-od-id','demo-bar');
  d.style.cssText='display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:var(--s3)';
  d.innerHTML='<span class="k">演示</span>'+
    ['pop|已填充','load|加载','error|错误','empty|空','long|302 段'].map(function(x){var p=x.split('|');
      return '<button class="act txt sm" data-st="'+p[0]+'">'+p[1]+'</button>'}).join('')+
    '<button class="act txt sm" id="whyBtn">设计依据</button>';
  $('demoSlot').appendChild(d);
  d.addEventListener('click',function(e){var b=e.target.closest('[data-st]');
    if(b){var v=b.dataset.st;
      if(v==='long'){S.mid='m3';S.docId=null;S.q='';S.spk='';S.unfixed=false;S.view='t';S.state='pop';
        closeOver();setTabs();headRender();bodyRender();navRender();
        toast('302 段长会：纸白单栏 + 紧凑模式，一屏约 14 段',{u:0});return}
      S.view='t';
      if(v==='empty'){S.q='绝对不存在的词'}else if(v==='pop'){S.q='';S.state='pop'}else{S.state=v==='error'?'err':'load'}
      closeOver();setTabs();headRender();bodyRender();return}
    if(e.target.id==='whyBtn')openSheet('whySheet')});
  $('whBody').innerHTML=[
    ['为什么是单栏纸面','你的主战场是「听清楚 + 读明白」，所以屏幕主角只有一个：一份能直接递给领导的稿子。会议列表、术语、替换都收进抽屉，回来时按原样打开。'],
    ['逻辑学','流程是一行句子而不是三张卡：转写 ✓ · 校对 5 段未校〔补缺〕 · 理解 ✓ · 材料 2 份。缺什么，动词就长在句子里。'],
    ['人性工程','时码做天头旁注（与正文同一基线），点旁注跳播、点正文也跳播；空格/J/K/E/⌘↵ 不离键盘；改完立刻提示「材料已过期」并可一键重出。'],
    ['美术学','纸白 #f6f4f0 + 朱砂 #b0442c 单一强调色；正文一律宋体 17px/1.9，UI 用黑体，时码等宽；除稿纸外几乎没有第二个盒子。'],
    ['社会学','材料是盖了「会议纪要」朱印的文件：结论、待办（事项/负责人/期限/依据）、待确认分开摆，不把没拍板的事写成结论。']
  ].map(function(r){return '<div style="margin-bottom:var(--s4)"><div class="k" style="margin-bottom:4px">'+r[0]+
    '</div><p style="font-size:var(--small);color:var(--ink-2);line-height:1.65">'+r[1]+'</p></div>'}).join('')+
    '<p style="font-size:var(--cap);color:var(--muted)">音频用模拟时钟代替；字段与线上 /api 一一对应，落地不改后端。</p>';
})();

/* ── 启动 ── */
navRender();headRender();setTabs();bodyRender();seek(0);
</script>
