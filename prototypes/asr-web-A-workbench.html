<!doctype html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>会议转写工作台 · 方向 A 工作台密度</title>
<style>
/* ══ 方向 A：暗色工作台。层级靠字号与留白，不靠盒子；accent 一处主操作 + 一处选中 ══ */
:root{
  --bg:#0d0f12;            /* 最深：导航与侧栏 */
  --stage:#14171b;         /* 转写工作区（比导航亮一档，形成真实分区） */
  --raise:#1a1e23;         /* 悬浮/输入控件 */
  --raise-2:#212630;
  --fg:#e9ecf1; --fg-2:#b7bfcb; --muted:#8d97a7;
  --hair:rgba(255,255,255,.07); --hair-2:rgba(255,255,255,.13);
  --accent:#57a6ff; --accent-ink:#08111c; --accent-dim:rgba(87,166,255,.16);
  --ok:#4ec98c; --warn:#e0b268; --err:#f08b8b;
  --s1:#6fa8ff; --s2:#4dbfa8; --s3:#dba756; --s4:#c884c0; --s5:#84bd6b; --s6:#95a3cc;
  --ui:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --cap:12px; --small:13px; --body:16px; --h3:20px; --h2:26px; --display:32px;
  --s1p:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:8px; --r-lg:12px;
  --fast:100ms; --dur:150ms; --slow:240ms; --ease:cubic-bezier(.2,0,0,1);
  --nav:236px; --side:344px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
  font-size:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-dim)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.22}
p{margin:0}
svg{display:block}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ── 控件：只有主操作用 accent，其余是文字/发丝边 ───────── */
.act{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:var(--r);
  font-size:var(--small);letter-spacing:.02em;color:var(--fg-2);border:1px solid var(--hair);background:var(--raise);
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease),border-color var(--fast) var(--ease),
             transform var(--fast) var(--ease)}
.act:hover:not(:disabled){background:var(--raise-2);color:var(--fg);border-color:var(--hair-2)}
.act:active:not(:disabled){transform:translateY(1px)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.go{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600;min-height:32px;padding:0 14px}
.act.go:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.act.txt{border-color:transparent;background:none;color:var(--muted)}
.act.txt:hover:not(:disabled){color:var(--fg);background:var(--raise)}
.act[aria-pressed="true"]{color:var(--fg);border-color:var(--hair-2);background:var(--raise-2)}
.act.sm{min-height:24px;padding:0 8px;font-size:var(--cap)}
.act.dgr{color:var(--err);border-color:transparent;background:none}
.act.dgr:hover:not(:disabled){background:rgba(240,139,139,.12)}
.seg{display:inline-flex;gap:14px;align-items:center}
.seg button{font-size:var(--small);color:var(--muted);letter-spacing:.02em;padding:4px 0;
  border-bottom:1.5px solid transparent;transition:color var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.seg button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.seg button:hover{color:var(--fg)}
.fld{display:inline-flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--hair);
  border-radius:var(--r);padding:0 10px;min-height:32px;transition:border-color var(--fast) var(--ease)}
.fld:focus-within{border-color:var(--hair-2)}
.fld input{background:none;border:none;outline:none;min-width:0;flex:1;font-size:var(--small);padding:5px 0}
.fld input::placeholder{color:var(--muted)}
.fld svg{color:var(--muted);flex:none}
select{background:var(--raise);border:1px solid var(--hair);border-radius:var(--r);
  padding:5px 8px;font-size:var(--small);color:var(--fg-2)}
kbd{font-family:var(--num);font-size:var(--cap);background:var(--raise-2);border:1px solid var(--hair-2);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--fg-2)}
.hair-l{border-left:1px solid var(--hair)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.rot{width:12px;height:12px;border:1.8px solid var(--hair-2);border-top-color:var(--accent);border-radius:50%;
  animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 骨架 ──────────────────────────────────────────── */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
.bar{display:flex;align-items:center;gap:var(--s4);min-height:46px;padding:0 var(--s5);
  background:var(--bg);border-bottom:1px solid var(--hair)}
.bar .mark{font-size:var(--h3);letter-spacing:-.01em;font-weight:600}
.bar .mark span{font-family:var(--num);font-size:var(--cap);color:var(--muted);letter-spacing:.08em;margin-left:8px;font-weight:400}
.work{display:grid;grid-template-columns:var(--nav) minmax(0,1fr) var(--side);min-height:0}
.nav,.stage,.side{min-height:0;overflow:auto;overscroll-behavior:contain}
.nav{background:var(--bg);border-right:1px solid var(--hair);display:flex;flex-direction:column}
.stage{background:var(--stage);display:flex;flex-direction:column}
.side{background:var(--bg);border-left:1px solid var(--hair)}
.navHead{padding:var(--s4) var(--s5) var(--s3);display:flex;flex-direction:column;gap:var(--s3);
  position:sticky;top:0;background:var(--bg);z-index:3}
.navHead .t{display:flex;align-items:baseline;gap:8px}
.navHead h2{font-size:var(--small);color:var(--muted);letter-spacing:.06em;font-weight:600}
.items{padding:0 var(--s5) var(--s5);display:flex;flex-direction:column;gap:1px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;
  padding:9px 12px;border-radius:var(--r);border-left:2px solid transparent;
  transition:background var(--fast) var(--ease)}
.item:hover{background:var(--raise)}
.item[aria-current="true"]{background:var(--raise);border-left-color:var(--accent)}
.item .n{font-size:var(--small);font-weight:600;color:var(--fg);grid-column:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:var(--cap);color:var(--muted);grid-column:1;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .w{font-size:var(--cap);color:var(--muted);grid-column:2;grid-row:1;font-family:var(--num)}
.item .pf{grid-column:1 / -1;display:flex;gap:2px;margin-top:7px;align-items:center}
.item .pf i{height:2px;flex:1;border-radius:1px;background:var(--hair-2)}
.item .pf i.d{background:var(--ok)}
.item .pf i.p{background:var(--warn)}
.item .pf i.n{background:var(--accent)}
.item .pf em{font-style:normal;font-size:var(--cap);color:var(--muted);margin-left:6px;font-family:var(--num)}
.navFoot{margin-top:auto;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--hair);
  padding:var(--s3) var(--s5) var(--s4);display:flex;flex-direction:column;gap:2px}
.navFoot .l{display:flex;align-items:center;gap:8px;font-size:var(--cap);color:var(--muted);
  padding:5px 0;text-align:left;width:100%}
.navFoot .l:hover{color:var(--fg)}
.navFoot .l b{margin-left:auto;font-weight:400;color:var(--fg-2);font-family:var(--num)}

/* ── 工作区头：会议名是唯一主角 ───────────────────────── */
.head{padding:var(--s6) var(--s7) var(--s4);position:sticky;top:0;z-index:6;background:var(--stage);
  border-bottom:1px solid var(--hair)}
.head .k{display:flex;align-items:center;gap:10px;font-size:var(--cap);color:var(--muted);
  letter-spacing:.02em;margin-bottom:var(--s3)}
.head h1{font-size:var(--h2);letter-spacing:-.015em;font-weight:600}
.head h1 input{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:1px solid transparent;
  border-radius:5px;padding:0 4px;margin-left:-4px;width:100%}
.head h1 input:hover{border-color:var(--hair)}
.head h1 input:focus{border-color:var(--hair-2);background:var(--raise)}
.head .meta{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3);
  font-size:var(--cap);color:var(--muted)}
.head .meta .num{color:var(--fg-2)}
.ply{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s5)}
.ply .btn{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;
  place-items:center;flex:none;transition:transform var(--fast) var(--ease),filter var(--fast) var(--ease)}
.ply .btn:hover{filter:brightness(.9)}.ply .btn:active{transform:scale(.94)}
.ply .tc{font-family:var(--num);font-size:var(--small);color:var(--fg-2);white-space:nowrap}
.ply .tc em{font-style:normal;color:var(--muted)}
.wav{flex:1;min-width:60px;height:26px;position:relative;cursor:pointer;border-radius:3px}
.wav svg{width:100%;height:100%}
.wav .b{fill:rgba(255,255,255,.2)}
.wav .q{fill:rgba(255,255,255,.07)}
.wav .pl{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--accent);left:0}
.wav:hover .b{fill:rgba(255,255,255,.3)}
.ply .tl{display:flex;align-items:center;gap:var(--s2);flex:none}

/* 工具行 */
.tools{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s7);
  border-bottom:1px solid var(--hair);position:sticky;top:var(--headH,196px);z-index:5;background:var(--stage)}
.tools .grow{flex:1;min-width:120px}
.tools .lbl{font-size:var(--cap);color:var(--muted);letter-spacing:.02em}

/* ── 转写正文：不用行盒，靠字号/留白/一条发丝线 ───────── */
.tx{padding:var(--s6) var(--s7) var(--s7);max-width:88ch}
.grp{margin-bottom:var(--s6)}
.grp .who{display:flex;align-items:center;gap:8px;margin-bottom:var(--s2)}
.grp .who i{width:7px;height:7px;border-radius:50%;background:var(--sp);flex:none}
.grp .who .nm{font-size:var(--cap);letter-spacing:.06em;color:var(--sp);font-weight:600;
  background:none;border:1px solid transparent;border-radius:4px;padding:1px 4px;margin-left:-4px}
.grp .who .nm:hover{background:var(--raise);border-color:var(--hair)}
.grp .who .nm:hover{text-decoration:underline;text-decoration-style:dotted;cursor:text}
.grp .who .n2{font-size:var(--cap);color:var(--muted);font-family:var(--num)}
.ln{display:grid;grid-template-columns:46px minmax(0,1fr) 56px 44px;gap:var(--s3);align-items:baseline;
  padding:3px 0;border-radius:5px;transition:background var(--fast) var(--ease)}
.ln:hover{background:var(--raise)}
.ln.now{background:var(--raise)}
.ln.now .tc2{color:var(--fg)}
.ln .tc2{font-family:var(--num);font-size:var(--cap);color:var(--muted);text-align:right;cursor:pointer;
  letter-spacing:.01em;user-select:none}
.ln .tc2:hover{color:var(--fg-2)}
.ln .bd{font-size:var(--body);line-height:1.75;color:var(--fg);word-break:break-word;cursor:text;
  text-indent:-.9em;padding-left:.9em}
.dense .tx{--body:14px}
.dense .grp{margin-bottom:var(--s5)}
.ln .bd .or{font-size:var(--cap);color:var(--muted);white-space:nowrap}
.ln .bd .or s{text-decoration:line-through;text-decoration-color:rgba(240,139,139,.5)}
.ln .bd mark{background:rgba(224,178,104,.28);border-radius:2px;padding:0 1px}
.ln .fix{font-size:var(--cap);color:var(--muted);text-align:right;letter-spacing:.01em}
.ln .fix.h{color:var(--warn)}
.ln .fix.l{color:var(--s2)}
.ln .fix.u{color:var(--warn)}
.ln .ops{grid-column:3;display:none;gap:2px;justify-content:flex-end}
.ln:hover .ops,.ln:focus-within .ops{display:flex}
.ln:hover .fix,.ln:focus-within .fix{display:none}
.ed{grid-column:2 / -1;margin-top:var(--s2);background:var(--raise);border:1px solid var(--hair-2);
  border-radius:var(--r-lg);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.ed textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--hair);border-radius:6px;
  padding:9px 11px;font-size:var(--small);line-height:1.7;resize:vertical;outline:none}
.ed textarea:focus{border-color:var(--hair-2)}
.ed .r{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.picked{grid-column:1;align-self:center;width:16px;height:16px;accent-color:var(--accent)}
.dotted{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--hair-2)}

/* ── 侧栏：流程用发丝连线，不用卡片汤 ─────────────────── */
.sideH{padding:var(--s4) var(--s5) var(--s2);display:flex;align-items:baseline;gap:8px}
.sideH h2{font-size:var(--small);color:var(--muted);letter-spacing:.06em;font-weight:600}
.flow{padding:0 var(--s5)}
.st{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);gap:var(--s3);
  padding:var(--s3) 0 var(--s4)}
.st::before{content:"";position:absolute;left:9.5px;top:34px;bottom:-6px;width:1px;background:var(--hair)}
.st:last-child::before{display:none}
.st .ic{width:20px;height:20px;border-radius:50%;border:1px solid var(--hair-2);display:grid;place-items:center;
  background:var(--bg);color:var(--muted);z-index:1}
.st.done .ic{border-color:rgba(78,201,140,.5);color:var(--ok)}
.st.part .ic{border-color:rgba(224,178,104,.5);color:var(--warn)}
.st.run .ic{border-color:rgba(87,166,255,.55);color:var(--accent)}
.st .n{font-size:var(--small);font-weight:600;color:var(--fg)}
.st .d{font-size:var(--cap);color:var(--muted);margin-top:3px;line-height:1.55}
.st .d b{color:var(--fg-2);font-weight:600}
.st .a{margin-top:var(--s2);display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.job{margin:0 var(--s5) var(--s4);padding:var(--s3) 0 0;border-top:1px solid var(--hair)}
.job .r{display:flex;align-items:center;gap:8px;font-size:var(--cap);color:var(--muted)}
.job .r b{color:var(--fg);font-weight:600;font-size:var(--small)}
.job .r .sp{flex:1}
.job .pb{height:2px;background:var(--hair-2);border-radius:1px;margin:var(--s3) 0;overflow:hidden}
.job .pb i{display:block;height:100%;background:var(--accent);transition:width var(--dur) var(--ease)}
.tabs{display:flex;gap:var(--s4);padding:var(--s3) var(--s5);border-top:1px solid var(--hair);
  border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{font-size:var(--small);color:var(--muted);padding:2px 0 7px;border-bottom:1.5px solid transparent;
  letter-spacing:.02em}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .c{font-family:var(--num);font-size:var(--cap);color:var(--muted);margin-left:5px}
.sBody{padding:var(--s5)}
.sec{margin-bottom:var(--s5)}
.sec h3{font-size:var(--cap);letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:var(--s3)}
.row{font-size:var(--small);line-height:1.65;color:var(--fg-2);padding:var(--s2) 0;
  border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:none}
.row .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .hd b{color:var(--fg);font-weight:600;flex:1;min-width:55%}
.row .mo{font-size:var(--cap);color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .mo em{font-style:normal;color:var(--fg-2)}
.rf{font-family:var(--num);font-size:var(--cap);color:var(--fg-2);border:1px solid var(--hair);
  border-radius:999px;padding:0 7px;line-height:17px;display:inline-block;cursor:pointer;
  transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.rf:hover{border-color:var(--accent);color:var(--accent)}
table.tb{width:100%;border-collapse:collapse;font-size:var(--small)}
table.tb th{text-align:left;font-size:var(--cap);color:var(--muted);font-weight:500;letter-spacing:.02em;
  padding:0 8px 6px 0;border-bottom:1px solid var(--hair)}
table.tb td{padding:8px 8px 8px 0;border-bottom:1px solid var(--hair);color:var(--fg-2);vertical-align:top}
table.tb td.own{color:var(--fg);white-space:nowrap}
table.tb tr:last-child td{border-bottom:none}
/* 材料（成品）：这一栏里唯一用衬线的地方 */
.paper{background:var(--raise);border:1px solid var(--hair);border-radius:var(--r-lg);
  padding:var(--s5) var(--s5) var(--s6);font-family:var(--serif);line-height:1.85}
.paper h1{font-size:var(--h3);letter-spacing:-.01em;font-weight:600;margin-bottom:4px}
.paper .sub{font-family:var(--ui);font-size:var(--cap);color:var(--muted);letter-spacing:.02em;
  padding-bottom:var(--s4);margin-bottom:var(--s4);border-bottom:1px solid var(--hair)}
.paper h2{font-family:var(--ui);font-size:var(--cap);letter-spacing:.06em;color:var(--muted);
  font-weight:600;margin:var(--s5) 0 var(--s2)}
.paper p,.paper li{font-size:var(--small);color:var(--fg)}
.paper ul,.paper ol{margin:0 0 var(--s3);padding-left:1.35em}
.paper li{margin-bottom:5px}
.paper .rf{font-family:var(--num);vertical-align:.12em;margin-left:3px}
.dbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--s3)}
.dbar .sp{flex:1}
.drow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);
  font-size:var(--small);cursor:pointer}
.drow:last-child{border-bottom:none}
.drow:hover .t{color:var(--accent)}
.drow .t{flex:1;min-width:0;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .w{font-size:var(--cap);color:var(--muted);font-family:var(--num)}

/* ── 五态 ─────────────────────────────────────────── */
.load{background:var(--raise);border-radius:4px;background-image:linear-gradient(90deg,rgba(255,255,255,.03),
  rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:sh 1.4s var(--ease) infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{border:1px dashed var(--hair-2);border-radius:var(--r-lg);padding:var(--s6) var(--s5);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2)}
.empty h3{font-size:var(--h3);letter-spacing:-.01em}
.empty p{font-size:var(--small);color:var(--muted);max-width:44ch}
.err{display:flex;gap:10px;align-items:flex-start;background:rgba(240,139,139,.09);
  border:1px solid rgba(240,139,139,.3);border-radius:var(--r-lg);padding:var(--s3) var(--s4)}
.err .t{font-size:var(--small);font-weight:600;color:var(--err)}
.err .d{font-size:var(--cap);color:var(--fg-2);margin-top:3px;line-height:1.6}
.err .a{display:flex;gap:8px;align-items:center;margin-top:var(--s3);flex-wrap:wrap}
.err .ag{font-size:var(--cap);color:var(--muted);font-family:var(--num)}
.banner{display:flex;align-items:center;gap:10px;font-size:var(--small);color:var(--fg-2);
  background:var(--raise);border:1px solid var(--hair);border-left:2px solid var(--warn);
  border-radius:var(--r);padding:9px var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.tip{display:flex;gap:8px;align-items:flex-start;font-size:var(--cap);color:var(--muted);line-height:1.6}
.tip svg{margin-top:2px;flex:none}

.sheet{position:fixed;z-index:50;background:var(--bg);border:1px solid var(--hair-2);box-shadow:0 18px 48px rgba(0,0,0,.5);

.sheet .sh h2{font-size:var(--h3);letter-spacing:-.01em;flex:1}
.sheet .sb{padding:var(--s5)}
.tr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:var(--small)}
.tr:last-of-type{border-bottom:none}
.tr .w{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:60;display:flex;align-items:center;

/* 波形：按片段实际时长绘制，静音段留空 */
function wave(){
  var m=M(),a=SG(),w=Math.min(Math.ceil(m.d/0.5),420),parts=[];
  for(var i=0;i<w;i++){var t=i*(m.d/w),inS=false;
    for(var j=0;j<a.length;j++){var s0=a[j].t,s1=(j+1<a.length?a[j+1].t:m.d);if(t>=s0&&t<s1){inS=true;break}}
    var e=inS?(0.3+0.7*Math.abs(Math.sin(i*1.7)*0.55+Math.sin(i*0.41)*0.45)):0.08;
    var h=Math.max(2,Math.round(e*22));
    parts.push('<rect class="'+(inS?'b':'q')+'" x="'+(i*(420/w))+'" y="'+((26-h)/2)+'" width="'+(420/w*.6)+'" height="'+h+'" rx="'+(420/w*.3)+'"/>');}
  var o=$('wv').querySelector('svg');if(o)o.remove();
  $('wv').insertAdjacentHTML('afterbegin','<svg viewBox="0 0 420 26" preserveAspectRatio="none">'+parts.join('')+'</svg>');
}

function docHtml(d){

  function inl(t){return esc(t).replace(/\[#(\d+)\]/g,function(_,n){return '<button class="rf" data-rf="'+n+'">#'+n+'</button>'})}
  while(i<L.length){var l=L[i];
    if(!l.trim()){i++;continue}
    if(l.indexOf('# ')===0){o.push('<h1>'+inl(l.slice(2))+'</h1>');
      var h=d.head||{};o.push('<div class="sub">'+[h.au,h.wd,h.to].filter(Boolean).map(esc).join(' · ')+'</div>');i++;continue}
    if(l.indexOf('## ')===0){o.push('<h2>'+inl(l.slice(3))+'</h2>');i++;continue}
    if(l.charAt(0)==='|'){var tb=[],j=i;
      while(j<L.length&&L[j].charAt(0)==='|'){if(L[j].indexOf('---')<0){var cs=L[j].split('|').slice(1,-1).map(function(c){return c.trim()});
        tb.push('<tr>'+cs.map(function(c){return '<td>'+inl(c)+'</td>'}).join('')+'</tr>')}j++}
      o.push('<table class="tb"><tbody>'+tb.join('')+'</tbody></table>');i=j;continue}
    if(/^([-*]|\d+\.)\s/.test(l)){var its=[];
      while(i<L.length&&/^([-*]|\d+\.)\s/.test(L[i])){its.push(L[i].replace(/^([-*]|\d+\.)\s/,''));i++}
      o.push((l.charAt(0)==='-'?'<ul>':'<ol>')+its.map(function(x){return '<li>'+inl(x)+'</li>'}).join('')+(l.charAt(0)==='-'?'</ul>':'</ol>'));continue}
    o.push('<p>'+inl(l)+'</p>');i++}

    seek(a[i].t);play(1);var el=$('ln-'+a[i].id);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
    e.preventDefault();return}
  if(e.key==='e'){var c2=cur();if(c2){S.edit=c2.id;txRender();var ta=$('ta');if(ta)ta.focus()}e.preventDefault()}});
$('upBtn').onclick=function(){$('upBox').hidden=false;var p=0;clearInterval($('upBar')._t);
  $('upBar')._t=setInterval(function(){p+=8;$('upBar').style.width=Math.min(p,100)+'%';
    $('upPct').textContent=Math.min(p,100)+'%';
    if(p>=100){clearInterval($('upBar')._t);$('upBox').hidden=true;$('upBar').style.width='0';
      MEETS.unshift({id:'m'+Date.now(),ti:'新上传 · 客户沟通',f:'call-'+(200+MEETS.length)+'.m4a',d:268,sn:0,sp:0,w:'刚刚',
        st:{a:'run',p:'none',u:'none',c:'none'},status:'processing'});
      S.mid=MEETS[0].id;S.t=0;S.state='load';S.docId=null;renderAll();toast('上传完成，正在转写（2 分 48 秒录音，本机 GPU）',{u:0})}},90)};
['mN','mT','mS'].forEach(function(id){$(id).onclick=function(){
  ['mN','mT','mS'].forEach(function(x){$(x).setAttribute('aria-current',x===id?'page':'false')});
  if(id==='mN'){$('nav').classList.add('open');$('scrim').classList.add('on')}
  else if(id==='mT'){closeOver();$('tools').scrollIntoView({block:'start',behavior:'smooth'})}
  else{S.tab='c';sideRender();openSide()}}});

/* ══ 原型演示条 + 设计说明 ══ */
(function(){
  var d=document.createElement('div');d.setAttribute('data-od-id','demo-bar');
  d.style.cssText='display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--hair)';
  d.innerHTML='<span style="font-size:var(--cap);letter-spacing:.06em;color:var(--muted)">演示</span>'+
    ['pop|已填充','load|加载','error|错误','empty|空','long|302 段'].map(function(x){var p=x.split('|');
      return '<button class="act txt sm" data-st="'+p[0]+'">'+p[1]+'</button>'}).join('')+
    '<button class="act txt sm" id="whyBtn">设计依据</button>';
  $('demoSlot').appendChild(d);
  d.addEventListener('click',function(e){var b=e.target.closest('[data-st]');
    if(b){var v=b.dataset.st;
      if(v==='long'){S.mid='m3';S.docId=null;S.q='';S.spk='';S.unfixed=false;S.dense=true;$('sq').value='';
        $('tx').classList.add('dense');$('den').setAttribute('aria-pressed','true');renderAll();
        toast('302 段：紧凑模式 + 过滤 + 发言块，一屏约 18 段',{u:0});return}
      if(v==='empty'){S.q='绝对不存在的词';$('sq').value=S.q;S.state='pop'}
      else{if(v==='pop'){S.q='';$('sq').value=''}S.state=v==='pop'?'pop':v}
      txRender();return}
    if(e.target.id==='whyBtn')sheet('whySheet')});
  $('whBody').innerHTML=[
    ['为什么不是上一版','上一版层级平（没有唯一主角）、盒与胶囊过多、三层暗色几乎同色只靠发丝线，所以发闷。这版把主角交给会议标题与转写正文，盒子中掉到只剩输入控件。'],
    ['逻辑学','流程写成状态机（转写→校对→理解→材料），每步显示还差什么；页面主角是当前会议，产品名退回顶栏。'],
    ['人性工程','连续同人片段合成发言块；空格/J/K/E/⌘↵ 全程不离键盘；只看未校对、场内搜索、批量改派、紧凑模式；改完自动弹“材料已过期”并一键重出。'],
    ['美术学','字阶 12/13/16/20/26 五级 + 等宽时码；accent 只出现在主操作与当前选中项；说话人色只染小圆点与名字，不铺整行；正文限宽 88ch。'],
    ['社会学','材料用米黄纸感的标栏 + 宋体排版，像能直接递给领导的文件；待办是“事项/负责人/期限/依据”表；不确定的事留在“待确认”，不被 AI 抹平。']
  ].map(function(r){return '<div style="margin-bottom:var(--s4)"><div style="font-size:var(--cap);letter-spacing:.06em;color:var(--muted);margin-bottom:4px">'+
    r[0]+'</div><p style="font-size:var(--small);color:var(--fg-2);line-height:1.65">'+r[1]+'</p></div>'}).join('')+
    '<p style="font-size:var(--cap);color:var(--muted)">音频用模拟时钟代替；字段与线上 /api 一一对应，落地不改后端。</p>';
})();

function renderAll(){navRender();headRender();spkSel();txRender();flowRender();sideRender();if(S.bulk)bulkBar();tick()}
renderAll();
</script>
